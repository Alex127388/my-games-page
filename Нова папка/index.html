<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Комп'ютерні ігри</title>
  <style>
    /* Общие стили */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background: #f5f5f5;
      color: #333;
      padding: 20px;
    }

    /* Шапка */
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 2em;
      color: #2c3e50;
    }

    /* Секция с изображением */
    .hero {
      text-align: center;
      margin-bottom: 30px;
    }
    .hero img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* Список игр */
    .games-list {
      margin-bottom: 30px;
    }
    .games-list h2 {
      margin-bottom: 10px;
      color: #16a085;
    }
    .games-list ul {
      list-style-type: square;
      padding-left: 20px;
    }
    .games-list li {
      margin-bottom: 5px;
    }

    /* Ссылки */
    .links h2 {
      margin-bottom: 10px;
      color: #2980b9;
    }
    .links ol {
      padding-left: 20px;
    }
    .links a {
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
      color: #1abc9c;
    }

    /* Подвал */
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>Світ комп'ютерних ігор</h1>
  </header>

  <main>
    <!-- Изображение -->
    <section class="hero">
      <img src="game-image.png" alt="Геймер за компьютером" />
    </section>

    <!-- Список игр -->
    <section class="games-list">
      <h2>Улюблені ігри</h2>
      <ul>
        <li>The Witcher 3: Wild Hunt</li>
        <li>Cyberpunk 2077</li>
        <li>Assassin’s Creed Valhalla</li>
        <li>Stardew Valley</li>
      </ul>
    </section>

    <!-- Полезные ссылки -->
    <section class="links">
      <h2>Корисні ресурси</h2>
      <ol>
        <li><a href="https://store.steampowered.com" target="_blank">Steam</a></li>
        <li><a href="https://www.epicgames.com" target="_blank">Epic Games Store</a></li>
        <li><a href="https://www.gog.com" target="_blank">GOG.com</a></li>
      </ol>
    </section>
  </main>

  <footer>
    <p>© 2025 Комп'ютерні ігри</p>
  </footer>
</body>
</html>
